name: Windows 11 Layer B integration (deferred)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 要驗證的 protected develop exact commit
        required: true
        type: string
  workflow_call:
    inputs:
      commit_sha:
        description: 要驗證的 protected develop exact commit
        required: true
        type: string
    secrets:
      OBS_WEBSOCKET_PASSWORD:
        required: true
      W11_010_HARDWARE_AUTHORIZATION:
        required: true

permissions: {}

concurrency:
  group: w11-010-obs-integration
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      protected_sha: ${{ steps.verify.outputs.protected_sha }}
    env:
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      HARDWARE_AUTHORIZATION: ${{ secrets.W11_010_HARDWARE_AUTHORIZATION }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 驗證 protected develop target 與 authorization
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "Wells-sideproj/obs-voice-command-windows" ]]; then
            echo 'Layer B 必須在 canonical Windows repository 執行' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != 'refs/heads/develop' ]]; then
            echo 'Layer B 只接受 protected develop ref' >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'commit_sha 必須是精確 40 字元的 commit SHA' >&2
            exit 1
          fi
          if [[ "$HARDWARE_AUTHORIZATION" != 'approved' ]]; then
            echo '需要 separately recorded hardware authorization' >&2
            exit 1
          fi
          protected_sha="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/develop" \
            | jq -r '.object.sha')"
          if [[ "$protected_sha" != "$REQUESTED_SHA" ]]; then
            echo 'requested SHA 不是目前 protected develop SHA' >&2
            exit 1
          fi
          printf 'protected_sha=%s\n' "$protected_sha" >> "$GITHUB_OUTPUT"

  integration:
    name: windows11-integration / obs-e2e
    needs: preflight
    runs-on: [self-hosted, Windows, X64, obs-integration]
    permissions:
      contents: read
    env:
      OBS_EXECUTABLE: ${{ vars.W11_010_OBS_EXECUTABLE }}
      OBS_PROFILE: ${{ vars.W11_010_OBS_PROFILE }}
      OBS_COLLECTION: ${{ vars.W11_010_OBS_COLLECTION }}
      OBS_WEBSOCKET_PASSWORD: ${{ secrets.OBS_WEBSOCKET_PASSWORD }}
      W11_010_HARDWARE_AUTHORIZED: ${{ secrets.W11_010_HARDWARE_AUTHORIZATION }}
      GITHUB_ACTIONS: 'true'
    steps:
      - name: Checkout exact protected SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.protected_sha }}
          persist-credentials: false

      - name: 選擇 Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: 安裝 locked project
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.8"
          uv sync --frozen

      - name: 執行 deterministic command-to-transform harness
        shell: pwsh
        run: |
          uv run --frozen python tools/windows11_integration_harness.py `
            --obs-executable "$env:OBS_EXECUTABLE" `
            --profile "$env:OBS_PROFILE" `
            --collection "$env:OBS_COLLECTION" `
            --config config.toml
