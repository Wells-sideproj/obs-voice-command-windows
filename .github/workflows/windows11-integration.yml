name: Windows 11 Layer B integration (deferred)

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: w11-obs-integration
  cancel-in-progress: false

jobs:
  prep-status:
    name: windows11-integration / prep-status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report deferred preparation status
        shell: bash
        run: |
          set -euo pipefail
          echo 'PREP_DISABLED'
          echo 'not_certified'

  integration:
    if: ${{ false }}
    name: windows11-integration / obs-e2e
    runs-on:
      group: w11-obs-integration
      labels: [self-hosted, Windows, X64, obs-integration]
    permissions:
      contents: read
    steps:
      - name: Layer B is disabled during offline preparation
        shell: pwsh
        run: |
          Write-Output 'PREP_DISABLED'
          Write-Output 'not_certified'
