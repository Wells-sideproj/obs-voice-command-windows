[obs]
host = "localhost"
port = 4455
password = ""       # 本機密碼；不要提交真實密碼
scene = ""          # 空 = 使用目前 program scene
source = ""         # 空 = 僅在恰好一個支援 capture source 時自動選取；多個時請填 exact name

[zoom]
level = 2.0         # OBS 縮放倍率
os_level = 2.0      # 範例 override；只供 macOS-only --os 模式。省略時程式預設為 1.5
deadzone = 0.15     # 滑鼠死區（可視範圍比例），內部移動不觸發追蹤
smoothing = 0.12    # 緩動係數（越大追越快）

[audio]
device = ""         # 空 = 系統預設麥克風（--list-devices 查名稱）

[[commands]]
phrases = ["來個特寫", "放大一點"]
action = "zoom_in"

[[commands]]
phrases = ["退回全畫面", "退出特寫", "退出", "拉遠"]
action = "zoom_out"
